name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Include standard binary paths
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # Navigate to your cloned repository folder
            cd /path/to/your/cloned/quiz-app-server
            
            # Fetch and pull latest changes
            git fetch --all
            git reset --hard origin/main
            
            # Install any new production dependencies
            npm ci --omit=dev
            
            # Reload application with zero downtime
            pm2 restart quiz-app || pm2 start index.js --name "quiz-app"
            pm2 save